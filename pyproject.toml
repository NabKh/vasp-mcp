[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vasp-mcp"
dynamic = ["version"]
description = "MCP server that lets MCP clients check VASP inputs before you submit and read VASP results after: convergence, energies, forces, band gaps, warnings."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nabil Khossossi" }]
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3,<3",
  "vasp-lint @ git+https://github.com/NabKh/vasp-lint",
]
keywords = ["vasp", "dft", "mcp", "model-context-protocol", "materials-science", "computational-chemistry"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
vasp-mcp = "vasp_mcp.server:main"

[project.urls]
Source = "https://github.com/NabKh/vasp-mcp"
Issues = "https://github.com/NabKh/vasp-mcp/issues"

[tool.setuptools.dynamic]
version = { attr = "vasp_mcp.__version__" }

[tool.setuptools.packages.find]
include = ["vasp_mcp*"]

[tool.ruff]
line-length = 120
